apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-station
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-station
  template:
    metadata:
      labels:
        app: central-station
    spec:
      containers:
        - name: central-station
          image: central-station-app
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKER
              value: "kafka:9092"
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/weather_db"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rain-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rain-processor
  template:
    metadata:
      labels:
        app: rain-processor
    spec:
      containers:
        - name: rain-processor
          image: rain-processor-app
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKER
              value: "kafka:9092"