services:
  zookeeper:
    image: bitnamilegacy/zookeeper:3.8
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnamilegacy/kafka:3.6
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper

  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: weather_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./sql:/docker-entrypoint-initdb.d/
      - postgres_data:/var/lib/postgresql/data
  central-station:
    image: central-station-app 
    build:
      context: .
      dockerfile: Dockerfile.central
    depends_on:
      - kafka
      - postgres
    environment: 
      KAFKA_BROKER: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/weather_db
      DB_USER: postgres
      DB_PASSWORD: password

  weather-station:
    image: weather-station-app
    build:
      context: .
      dockerfile: Dockerfile.station
    depends_on:
      - kafka
    deploy:
      replicas: 10 
    environment:
      KAFKA_BROKER: kafka:9092

  rain-processor:
    image: rain-processor-app
    build:
      context: .
      dockerfile: Dockerfile.rain
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092

volumes:
  postgres_data: